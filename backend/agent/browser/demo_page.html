<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Agent Mouse Acceptance Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 40px;
      background: #f8fafc;
      color: #1e293b;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 650px;
      margin-bottom: 24px;
    }
    h1 { margin-top: 0; color: #0f172a; font-size: 24px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .spacer { height: 700px; background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 10px, #e2e8f0 10px, #e2e8f0 20px); border-radius: 8px; margin: 20px 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #64748b; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      background: #fee2e2;
      color: #991b1b;
      margin-top: 8px;
    }
    .status-badge.success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Acceptance Test: Mouse & Typing</h1>
    <p>Target for testing synthetic visible mouse movement, clicking, typing, and smooth scroll.</p>
    
    <div>
      <label><strong>1. Click Test</strong></label><br>
      <button id="test-button" style="margin-top: 8px;">Click Me!</button>
      <div id="click-status" class="status-badge">Not Clicked</div>
    </div>

    <div style="margin-top: 24px;">
      <label><strong>2. Typing Test</strong></label>
      <input type="text" id="test-input" placeholder="Type something here..." />
      <div id="typing-status" class="status-badge">Empty</div>
    </div>
  </div>

  <div class="spacer">
    Scroll Down For Bottom Target
  </div>

  <div class="card" id="bottom-card">
    <h2>3. Scrolled Target</h2>
    <p>Reached bottom section via smooth scrolling.</p>
    <button id="bottom-button">Confirm Scrolled</button>
    <div id="scroll-status" class="status-badge">Not Clicked</div>
  </div>

  <script>
    const btn = document.getElementById('test-button');
    const clickStatus = document.getElementById('click-status');
    btn.addEventListener('click', () => {
      clickStatus.textContent = 'Clicked Successfully!';
      clickStatus.classList.add('success');
    });

    const input = document.getElementById('test-input');
    const typingStatus = document.getElementById('typing-status');
    input.addEventListener('input', (e) => {
      typingStatus.textContent = 'Typed: ' + e.target.value;
      if (e.target.value.length > 3) {
        typingStatus.classList.add('success');
      }
    });

    const bottomBtn = document.getElementById('bottom-button');
    const scrollStatus = document.getElementById('scroll-status');
    bottomBtn.addEventListener('click', () => {
      scrollStatus.textContent = 'Bottom Button Clicked!';
      scrollStatus.classList.add('success');
    });
  </script>
</body>
</html>
