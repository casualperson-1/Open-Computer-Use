[supervisord]
nodaemon=true
user=agent
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset
priority=10
autorestart=true
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb_err.log

[program:openbox]
command=/usr/bin/openbox
priority=20
autorestart=true
environment=DISPLAY=":99"
stdout_logfile=/tmp/openbox.log
stderr_logfile=/tmp/openbox_err.log

[program:xsetroot]
command=/bin/sh -c "sleep 1 && xsetroot -display :99 -solid '#0b1220' -cursor_name left_ptr"
priority=25
autorestart=false
startretries=1
stdout_logfile=/tmp/xsetroot.log
stderr_logfile=/tmp/xsetroot_err.log

[program:app]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8765
directory=/app/server
priority=30
autorestart=true
environment=DISPLAY=":99",PYTHONPATH="/app/server",OPEN_COMPUTER_USE_DATA_DIR="/app/data",COMPUTER="desktop",VNC_URL="http://localhost:6080/vnc.html?autoconnect=true&resize=scale"
stdout_logfile=/tmp/open-computer-use.log
stderr_logfile=/tmp/open-computer-use_err.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -cursor
priority=35
autorestart=true
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc_err.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc_err.log

[program:chromium]
command=/bin/sh -c 'exec "$CHROME_BIN" --no-sandbox --disable-dev-shm-usage --no-first-run --no-default-browser-check --disable-gpu --start-maximized --window-position=0,0 --window-size=1280,720 about:blank'
priority=50
autorestart=true
environment=DISPLAY=":99"
stdout_logfile=/tmp/chromium.log
stderr_logfile=/tmp/chromium_err.log
