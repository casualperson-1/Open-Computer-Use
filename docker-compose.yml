# Open Computer Use — homelab deployment.
#
# Default (`docker compose up -d`): the server only. It publishes no ports and
# is reachable only from the compose network, plus outbound for model APIs.
#
# Proxy (`docker compose --profile proxy up -d`): Caddy becomes the only
# published surface, on 127.0.0.1:8080 unless PROXY_BIND/PROXY_PORT say otherwise.
#
# Desktop (`docker compose --profile desktop up -d`): the legacy all-in-one
# Xvfb + noVNC image. Separate profile, not part of the default stack.
#
# Backups (`docker compose --profile backup up -d backup`): a sidecar that runs
# `server.cli backup` on an interval into the same backups volume.
#
# Secrets are read-only files generated by deploy/generate-secrets.sh; nothing
# sensitive belongs in this file or in the environment block.

name: open-computer-use

# Every container writes to the Docker json-file driver; cap it so a chatty
# health check or a stuck node cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: open-computer-use-server:local
    restart: unless-stopped
    logging: *default-logging
    init: true
    read_only: true
    user: "10001:10001"
    environment:
      # Inside the private network the app listens on all container interfaces.
      # The owner guard (and ALLOW_REMOTE_BIND opt-in) is unchanged: with no
      # owner the container refuses to start.
      HOST: 0.0.0.0
      PORT: "8765"
      ALLOW_REMOTE_BIND: "true"
      OPEN_COMPUTER_USE_DATA_DIR: /data
      BACKUP_DIR: /backups
      # Mounted secrets, never literal values in this file.
      ENCRYPTION_KEY_FILE: /run/secrets/fernet_key
      SECRET_KEY_FILE: /run/secrets/secret_key
      # Caddy is the only peer, on the fixed subnet declared below.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/24}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # The URL printed by create-owner / create-invite when PUBLIC_BASE_URL is
      # empty: the published Caddy port, not the container's internal one.
      PROXY_PORT: ${PROXY_PORT:-8080}
      # open (default) | invite | closed. "open" means anyone who can reach this
      # server can create an account; choose invite/closed for a private service.
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      # Nobody falls back to the server's own desktop.
      REMOTE_NODE_MODE: ${REMOTE_NODE_MODE:-required}
      USER_RUN_LIMIT_PER_HOUR: ${USER_RUN_LIMIT_PER_HOUR:-30}
      USER_USAGE_CAP_USD: ${USER_USAGE_CAP_USD:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ocu-data:/data
      - ocu-backups:/backups
    # File secrets are bind mounts in non-swarm compose, so uid/gid/mode are
    # ignored; deploy/generate-secrets.sh makes them read-only (0444) inside a
    # mode-700 directory that only the owner can traverse.
    secrets:
      - fernet_key
      - secret_key
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - internal
      - egress
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional TLS/HTTP front door. The only service that publishes a port.
  caddy:
    profiles: ["proxy"]
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      # `internal` carries all traffic to the server (deterministic source IP
      # inside TRUSTED_PROXIES); `edge` exists only so Docker can publish a port,
      # which an internal-only network does not allow.
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 128

  # Optional scheduled backups. Writes database + Fernet key archives into the
  # same backups volume; `docker compose run --rm server backup` does one now.
  backup:
    profiles: ["backup"]
    image: open-computer-use-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    user: "10001:10001"
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          echo "backup: starting $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m server.cli backup
          sleep "$${BACKUP_INTERVAL:-86400}"
        done
    environment:
      OPEN_COMPUTER_USE_DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      ENCRYPTION_KEY_FILE: /run/secrets/fernet_key
      SECRET_KEY_FILE: /run/secrets/secret_key
    volumes:
      - ocu-data:/data:ro
      - ocu-backups:/backups
    secrets:
      - fernet_key
      - secret_key
    tmpfs:
      - /tmp:size=64m
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Outbound-only Cloudflare Tunnel. The token is a Docker secret, never a
  # literal in this file or in the environment. Point both public hostnames
  # (UI and /ws/node) at http://server:8765; see docs/remote-access.md.
  cloudflared:
    profiles: ["cloudflared"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # cloudflared reads the token from this file inside the container.
      TUNNEL_TOKEN_FILE: /run/secrets/cf_tunnel_token
    secrets:
      - cf_tunnel_token
    networks:
      - internal
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128

  # Outbound-only Twingate connector. Access and refresh tokens are Docker
  # secrets. The server stays a private resource with no public hostname; the
  # connector needs NET_ADMIN and the host's tun device.
  twingate:
    profiles: ["twingate"]
    image: twingate/connector:1
    restart: unless-stopped
    logging: *default-logging
    environment:
      TWINGATE_NETWORK: ${TWINGATE_NETWORK:-}
      TWINGATE_ACCESS_TOKEN_FILE: /run/secrets/twingate_access_token
      TWINGATE_REFRESH_TOKEN_FILE: /run/secrets/twingate_refresh_token
      TWINGATE_LOG_LEVEL: ${TWINGATE_LOG_LEVEL:-3}
    secrets:
      - twingate_access_token
      - twingate_refresh_token
    networks:
      - internal
      - egress
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  # Test-only local stand-in for a tunnel edge. It adds X-Forwarded-Proto:
  # https and a fixed CF-Connecting-IP, so the trust chain and Secure cookies
  # can be exercised without a Cloudflare account. Never expose this port.
  tunnel-sim:
    profiles: ["tunnelsim"]
    # Unprivileged nginx: binds 8080 inside the container, runs as uid 101.
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    ports:
      - "127.0.0.1:${TUNNEL_SIM_PORT:-8090}:8080"
    volumes:
      - ./deploy/tunnel-sim.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=16m
      - /tmp:size=4m
    networks:
      # `internal` reaches the server; `edge` exists only so Docker can publish
      # the loopback port (internal-only networks cannot publish ports).
      - internal
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 128

  # Optional legacy all-in-one desktop (Xvfb + noVNC + server in one container).
  # Create its owner once with:
  #   docker compose run --rm -it desktop python -m server.cli create-owner
  desktop:
    profiles: ["desktop"]
    build:
      context: .
      dockerfile: browser/Dockerfile
    image: open-computer-use-desktop:local
    container_name: open-computer-use-desktop
    restart: unless-stopped
    logging: *default-logging
    shm_size: "1gb"
    environment:
      DISPLAY: ":99"
      RESOLUTION: 1280x720x24
      COMPUTER: desktop
      HUMAN_MOUSE: "true"
      HOST: 0.0.0.0
      ALLOW_REMOTE_BIND: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OPEN_COMPUTER_USE_DATA_DIR: /app/data
      VNC_URL: http://localhost:${DESKTOP_VNC_PORT:-6080}/vnc.html?autoconnect=true&resize=scale
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:${DESKTOP_WEB_PORT:-8765}:8765"
      - "127.0.0.1:${DESKTOP_VNC_PORT:-6080}:6080"
    volumes:
      - ocu-desktop-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - egress

networks:
  # No route to the internet: only Caddy talks to the server here.
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Outbound only, for model APIs. Nothing is published on this network.
  egress:
    driver: bridge
  # Host-published side of the proxy. The server is not attached, so Caddy and
  # the server only share `internal` and the resolved client IP is predictable.
  edge:
    driver: bridge

secrets:
  fernet_key:
    file: ./deploy/secrets/fernet.key
  secret_key:
    file: ./deploy/secrets/secret_key
  # Only read when the matching profile is started. Create them with
  # deploy/generate-secrets.sh or by writing the token into the file (0444).
  cf_tunnel_token:
    file: ./deploy/secrets/cf_tunnel_token
  twingate_access_token:
    file: ./deploy/secrets/twingate_access_token
  twingate_refresh_token:
    file: ./deploy/secrets/twingate_refresh_token

volumes:
  ocu-data:
  ocu-backups:
  ocu-desktop-data:
  caddy-data:
  caddy-config:
