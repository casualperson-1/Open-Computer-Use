services:
  open-computr-use:
    build:
      context: .
      dockerfile: browser/Dockerfile
    container_name: open-computr-use
    environment:
      - DISPLAY=:99
      - RESOLUTION=1280x720x24
      - COMPUTER=desktop
      - HUMAN_MOUSE=true
      - OPEN_COMPUTR_USE_DATA_DIR=/app/data
      - VNC_URL=http://localhost:6080/vnc.html?autoconnect=true&resize=scale
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-anthropic}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL:-}
      - OPENAI_COMPATIBLE_VISION=${OPENAI_COMPATIBLE_VISION:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:8765:8765" # Open Computr Use dashboard
      - "127.0.0.1:6080:6080" # noVNC virtual desktop
    volumes:
      - open-computr-use-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  open-computr-use-data:
