# Test-only stand-in for an edge proxy such as Cloudflare Tunnel.
# It does not authenticate anything: it only adds the headers the real edge
# adds, so the server's trust logic can be exercised offline.
#
#   docker compose --profile tunnelsim up -d tunnel-sim
#   PUBLIC_BASE_URL=https://agent.example.test docker compose ... up server
#
# The fixed CF-Connecting-IP makes it obvious when the server believes a
# forwarded client address instead of the proxy's own IP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://server:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  203.0.113.50;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
        proxy_buffering     off;
    }
}
